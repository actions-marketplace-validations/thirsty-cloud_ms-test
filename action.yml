name: "mstest999"
description: "Say hello to a user or the world"
author: "thirsty-cloud"

branding:
  icon: "play-circle"
  color: "red"

inputs:
  who-to-greet:
    description: "Who to greet"
    required: false
    default: "World"

runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - ${{ inputs.who-to-greet }}
