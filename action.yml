name: 3-Test Action from Marketplace

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  run-custom-action:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Call the composite action
      - name: mstest999
        uses: thirsty-cloud/ms-test@mstest999
        id: custom_rng
        with:
          user-name: 'Alice'

      # Step 3: Consume the output from the composite action
      - name: Use the returned random number
        run: |
          echo "The composite action successfully returned the number: ${{ steps.custom_rng.outputs.generated-number }}"
